<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フレミング 動的空間座標モデル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            color: #f3f4f6;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            width: 340px;
            border-radius: 12px;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-panel" class="p-5">
        <h2 class="text-xl font-bold mb-2 text-white border-b border-gray-700 pb-2">XYZ &times; FBI &times; (W₁ W₂ W₃) = 1</h2>
        <p style="font-size: 0.8rem; margin-top: -10px; margin-bottom: 15px; color: #aaa;">
          動的空間ベクトル・単位球シミュレーション
        </p>

        <div class="space-y-4">
            <div>
                <div class="flex justify-between text-sm mb-1">
                    <label class="text-gray-300 font-medium">単振動の速度 (F)</label>
                    <span id="osc-val" class="text-orange-400 font-mono">1.0</span>
                </div>
                <input type="range" id="osc-speed" min="0" max="3" step="0.1" value="1.0">
            </div>

            <div>
                <div class="flex justify-between text-sm mb-1">
                    <label class="text-gray-300 font-medium">回転の速度 (B, I)</label>
                    <span id="rot-val" class="text-cyan-400 font-mono">1.5</span>
                </div>
                <input type="range" id="rot-speed" min="0" max="5" step="0.1" value="1.5">
            </div>
        </div>

        <div class="mt-6 space-y-2 text-xs bg-gray-900/50 p-3 rounded-lg border border-gray-800">
            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-orange-500"></div> F (力/運動) : Z軸上の単振動</div>
            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-cyan-400"></div> B (磁界) : 水平面の回転</div>
            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#9acd32]"></div> I (電流) : 水平面の回転</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(5, 5, 4);
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const axesHelper = new THREE.AxesHelper(3);
        scene.add(axesHelper);

        const gridHelper = new THREE.GridHelper(10, 20, 0x444444, 0x1a1a1a);
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);

        const colF = 0xffa500;
        const colB = 0x00ffff;
        const colI = 0x9acd32;

        function createSphere(color, size = 0.08, parent = scene) {
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            parent.add(mesh);
            return mesh;
        }

        function createDynamicLine(color, parent = scene) {
            const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(6);
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const line = new THREE.Line(geo, mat);
            parent.add(line);
            return line;
        }

        function updateDynamicLine(line, p1, p2) {
            const positions = line.geometry.attributes.position.array;
            positions[0] = p1.x; positions[1] = p1.y; positions[2] = p1.z;
            positions[3] = p2.x; positions[4] = p2.y; positions[5] = p2.z;
            line.geometry.attributes.position.needsUpdate = true;
        }

        class Trail {
            constructor(maxPoints, color) {
                this.maxPoints = maxPoints;
                this.count = 0;
                this.positions = new Float32Array(maxPoints * 3);
                this.geometry = new THREE.BufferGeometry();
                this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                this.material = new THREE.LineBasicMaterial({ 
                    color: color, 
                    transparent: true, 
                    opacity: 0.6 
                });
                this.line = new THREE.Line(this.geometry, this.material);
                scene.add(this.line);
            }

            update(pos) {
                for(let i = 0; i < (this.maxPoints - 1) * 3; i++) {
                    this.positions[i] = this.positions[i + 3];
                }
                const lastIdx = (this.maxPoints - 1) * 3;
                this.positions[lastIdx] = pos.x;
                this.positions[lastIdx + 1] = pos.y;
                this.positions[lastIdx + 2] = pos.z;

                if (this.count < this.maxPoints) this.count++;
                this.geometry.setDrawRange(this.maxPoints - this.count, this.count);
                this.geometry.attributes.position.needsUpdate = true;
            }
        }

        const MAX_TRAIL_PTS = 1500;

        const group_p = new THREE.Group();
        const group_m = new THREE.Group();

        group_p.position.set(0, 0, 1);
        group_m.position.set(0, 0, -1);

        scene.add(group_p);
        scene.add(group_m);

        const originPoint = createSphere(0x666666, 0.05, scene); 
        originPoint.position.set(0,0,0);

        const fixedAxis_p = createDynamicLine(0x333333, scene);
        updateDynamicLine(fixedAxis_p, new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,1));
        const fixedAxis_m = createDynamicLine(0x333333, scene);
        updateDynamicLine(fixedAxis_m, new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1));

        const originVec_p = new THREE.Vector3(0, 0, 0);
        const originPoint_p = createSphere(0xffffff, 0.05, group_p); 
        originPoint_p.position.copy(originVec_p);

        const axisLine_p = createDynamicLine(0x666666, group_p);
        updateDynamicLine(axisLine_p, new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0, 1));

        const endPoint_p1 = createSphere(0x555555, 0.03, group_p);
        endPoint_p1.position.set(0, 0, 1);
        const endPoint_p2 = createSphere(0x555555, 0.03, group_p);
        endPoint_p2.position.set(0, 0, -1);

        const pointF_p = createSphere(colF, 0.08, group_p);
        const pointB_p = createSphere(colB, 0.08, group_p);
        const pointI_p = createSphere(colI, 0.08, group_p);

        const line_Fp_Bp = createDynamicLine(colB, group_p);
        const line_Fp_Ip = createDynamicLine(colI, group_p);

        const trail_Bp = new Trail(MAX_TRAIL_PTS, colB);
        const trail_Ip = new Trail(MAX_TRAIL_PTS, colI);

        const originVec_m = new THREE.Vector3(0, 0, 0);
        const originPoint_m = createSphere(0xffffff, 0.05, group_m); 
        originPoint_m.position.copy(originVec_m);

        const axisLine_m = createDynamicLine(0x666666, group_m);
        updateDynamicLine(axisLine_m, new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0, 1));

        const endPoint_m1 = createSphere(0x555555, 0.03, group_m);
        endPoint_m1.position.set(0, 0, 1);
        const endPoint_m2 = createSphere(0x555555, 0.03, group_m);
        endPoint_m2.position.set(0, 0, -1);

        const pointF_m = createSphere(colF, 0.08, group_m);
        const pointB_m = createSphere(colB, 0.08, group_m);
        const pointI_m = createSphere(colI, 0.08, group_m);

        const line_Fm_Bm = createDynamicLine(colB, group_m);
        const line_Fm_Im = createDynamicLine(colI, group_m);

        const trail_Bm = new Trail(MAX_TRAIL_PTS, colB);
        const trail_Im = new Trail(MAX_TRAIL_PTS, colI);

        let phaseOsc = 0;
        let phaseRot = 0;
        let phaseAxis = 0;
        const clock = new THREE.Clock();

        const uiOscSpeed = document.getElementById('osc-speed');
        const uiRotSpeed = document.getElementById('rot-speed');
        const uiOscVal = document.getElementById('osc-val');
        const uiRotVal = document.getElementById('rot-val');

        uiOscSpeed.addEventListener('input', (e) => uiOscVal.innerText = parseFloat(e.target.value).toFixed(1));
        uiRotSpeed.addEventListener('input', (e) => uiRotVal.innerText = parseFloat(e.target.value).toFixed(1));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const dt = clock.getDelta();
            const oscSpd = parseFloat(uiOscSpeed.value);
            const rotSpd = parseFloat(uiRotSpeed.value);

            phaseAxis += dt * 0.4;

            group_p.rotation.x = phaseAxis * 1.0;
            group_p.rotation.y = phaseAxis * 1.618;
            group_p.rotation.z = phaseAxis * 1.324;

            group_m.rotation.x = phaseAxis * 1.414;
            group_m.rotation.y = -phaseAxis * 1.0;
            group_m.rotation.z = -phaseAxis * 1.732;

            phaseOsc += dt * oscSpd;

            const local_zPlus = -Math.cos(phaseOsc);
            const local_zMinus = Math.cos(phaseOsc);

            const wp_F_p = new THREE.Vector3();
            pointF_p.getWorldPosition(wp_F_p);

            const wp_F_m = new THREE.Vector3();
            pointF_m.getWorldPosition(wp_F_m);

            const distance = wp_F_p.distanceTo(wp_F_m);

            const forceInteraction = 1 + Math.max(0, (4 - distance) * 0.6); 
            phaseRot += dt * rotSpd * forceInteraction;

            pointF_p.position.set(0, 0, local_zPlus);
            pointF_m.position.set(0, 0, local_zMinus);

            const theta = phaseRot;
            const thetaMinus = -phaseRot;

            const ip_x = Math.cos(theta);
            const ip_y = Math.sin(theta);
            const bp_x = -Math.sin(theta);
            const bp_y = Math.cos(theta);

            pointI_p.position.set(ip_x, ip_y, 0);
            pointB_p.position.set(bp_x, bp_y, 0);

            const im_x = -Math.cos(thetaMinus);
            const im_y = -Math.sin(thetaMinus);
            const bm_x = Math.sin(thetaMinus);
            const bm_y = -Math.cos(thetaMinus);

            pointB_m.position.set(bm_x, bm_y, 0);
            pointI_m.position.set(im_x, im_y, 0);

            updateDynamicLine(line_Fp_Bp, pointF_p.position, pointB_p.position);
            updateDynamicLine(line_Fp_Ip, pointF_p.position, pointI_p.position);

            updateDynamicLine(line_Fm_Bm, pointF_m.position, pointB_m.position);
            updateDynamicLine(line_Fm_Im, pointF_m.position, pointI_m.position);

            const wpTemp = new THREE.Vector3();

            pointB_p.getWorldPosition(wpTemp);
            trail_Bp.update(wpTemp);

            pointI_p.getWorldPosition(wpTemp);
            trail_Ip.update(wpTemp);

            pointB_m.getWorldPosition(wpTemp);
            trail_Bm.update(wpTemp);

            pointI_m.getWorldPosition(wpTemp);
            trail_Im.update(wpTemp);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
